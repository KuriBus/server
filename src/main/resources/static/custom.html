<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>캐릭터 커스터마이징 테스트</title>
</head>
<body>
<h2>커스터마이징 선택</h2>

<label for="nickname">닉네임:</label>
<input type="text" id="nickname" placeholder="닉네임을 입력하세요" />

<br><br>

<label for="body">body 스타일:</label>
<select id="body">
  <option value="1">남자 1</option>
  <option value="2">남자 2</option>
  <option value="3">남자 3</option>
  <option value="4">여자 1</option>
  <option value="5">여자 2</option>
  <option value="6">여자 3</option>
</select>

<button onclick="submitCustomization()">저장</button>

<h3>브로드캐스트 수신 로그</h3>
<pre id="broadcastLog" style="background:#f4f4f4; padding:10px;"></pre>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
  // === WebSocket 연결 및 구독 ===
  const socket = new SockJS('http://localhost:8080/ws/app'); // 서버 주소에 맞게 수정
  const stompClient = Stomp.over(socket);

  stompClient.connect({}, function () {
    console.log("WebSocket 연결됨");
    stompClient.subscribe('/topic/customization', function (message) {
      const data = JSON.parse(message.body);
      const log = `📣 브로드캐스트 수신됨!
닉네임: ${data.nickname}
몸통 타입: ${data.bodyType}

==============================`;
      document.getElementById("broadcastLog").innerText += log + '\n';
    });
  });

  // === REST API 호출 ===
  function submitCustomization() {
    const nickname = document.getElementById("nickname").value;
    const bodyType = document.getElementById("body").value;

    if (!nickname) {
      alert("닉네임을 입력하세요.");
      return;
    }

    fetch("http://localhost:8080/api/customization/update", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        nickname: nickname,
        bodyType: parseInt(bodyType),
      })
    })
    .then(response => {
      if (response.ok) {
        alert("저장 요청 성공 (브로드캐스트는 로그로 확인)");
      } else {
        alert("저장 요청 실패");
      }
    });
  }
</script>
</body>
</html>
