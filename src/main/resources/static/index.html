<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WebSocket 캐릭터 이동 테스트</title>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    body { background: #222; }
    #game {
      width: 1600px;
      height: 900px;
      background: #eee;
      position: relative;
      margin: 0 auto;
      overflow: hidden;
      box-shadow: 0 0 16px #999;
    }
    .zone {
      position: absolute;
      top: 0; left: 0;
      width: 1600px; height: 900px;
      background: #e0f7fa;
    }
    .zone.room { background: #e0f7fa; }
    .zone.bridge { background: #fffde7; }
    .zone-label {
      position: absolute; top: 20px; left: 40px;
      font-weight: bold; font-size: 40px; color: #333;
      text-shadow: 1px 1px 8px #fff;
      z-index: 10;
    }
    .character {
      width: 40px; height: 40px;
      background: #e53935;
      position: absolute;
      border-radius: 10px;
      text-align: center;
      line-height: 40px;
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      border: 2px solid #b71c1c;
      z-index: 5;
      box-shadow: 0 0 8px #0005;
    }
    .portal {
      width: 40px; height: 40px;
      background: #4fc3f7;
      border-radius: 50%;
      position: absolute;
      border: 4px solid #0288d1;
      box-shadow: 0 0 16px #0288d1aa;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #01579b;
      font-weight: bold;
    }
  </style>
</head>
<body>
<div id="userForm">
  <label for="userIdInput">유저 아이디: </label>
  <input type="text" id="userIdInput" placeholder="user1234">
  <button id="startBtn">시작</button>
</div>
<div id="game"></div>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
  let userId = null;
  let stompClient = null;
  const game = document.getElementById('game');

  // 그리드 크기 (40x22 셀, 40px 단위)
  const GRID_W = 40;  // 셀 너비(px)
  const GRID_H = 40;  // 셀 높이(px)
  const MAX_X = 39;   // 0~39 (1600/40=40)
  const MAX_Y = 21;   // 0~21 (900/40=22)
  const CENTER_X = Math.floor(MAX_X / 2); // 20
  const CENTER_Y = Math.floor(MAX_Y / 2); // 11

  // 모든 공간(룸/브릿지) 이름
  const allZones = ["Room 1","Bridge 1","Room 2","Bridge 2","Room 3","Bridge 3"];

  // 포탈 위치 정의 (x, y는 0~MAX_X, 0~MAX_Y 기준, y=MAX_Y/2가 중간)
  const portalPositions = {};
  allZones.forEach(zone => {
    portalPositions[zone] = [
      { x: 2, y: CENTER_Y, direction: "left" },
      { x: MAX_X-2, y: CENTER_Y, direction: "right" }
    ];
  });

  document.getElementById('startBtn').onclick = function() {
    userId = document.getElementById('userIdInput').value.trim();
    if (!userId) {
      alert('유저 아이디를 입력하세요!');
      return;
    }
    document.getElementById('userForm').style.display = 'none';

    // WebSocket 연결
    const socket = new SockJS('http://localhost:8080/ws/app');
    stompClient = Stomp.over(socket);

    let myZone = "Room 1"; // 기본값
    let myPos = { x: CENTER_X, y: CENTER_Y };

    stompClient.connect({}, function (frame) {
      // 1. 입장하자마자 중앙값 위치로 move 메시지 전송
      stompClient.send("/app/move", {}, JSON.stringify({
        userId: userId,
        direction: "init"
      }));

      // 2. 구독 및 화면 그리기
      stompClient.subscribe('/topic/positions', function (message) {
        const allPositions = JSON.parse(message.body);
        // 내 방 정보, 내 좌표 업데이트
        const me = allPositions.find(pos => pos.userId === userId);
        if (me && me.roomName !== undefined) {
          myZone = me.roomName;
          myPos = { x: me.x, y: me.y };
        }

        // 화면 클리어
        game.innerHTML = '';

        // zone(내가 있는 곳) 하나만 그림
        let zoneDiv = document.createElement('div');
        zoneDiv.className = 'zone ' + (myZone.startsWith('Room') ? 'room' : 'bridge');
        zoneDiv.innerHTML = `<span class="zone-label">${myZone}</span>`;
        game.appendChild(zoneDiv);

        // 포탈 그리기 (현재 zone에만)
        if (portalPositions[myZone]) {
          portalPositions[myZone].forEach(portal => {
            let portalDiv = document.createElement('div');
            portalDiv.className = 'portal';
            portalDiv.style.left = (portal.x * GRID_W) + 'px';
            portalDiv.style.top = (portal.y * GRID_H) + 'px';
            portalDiv.title = portal.direction + " portal";
            portalDiv.innerHTML = portal.direction === "left" ? "←" : "→";
            zoneDiv.appendChild(portalDiv);
          });
        }

        // 같은 zone 캐릭터만 그리기
        allPositions
        .filter(pos => pos.roomName === myZone)
        .forEach(pos => {
          let char = document.createElement('div');
          char.className = 'character';
          char.style.left = (Math.max(0, Math.min(1600 - 40, pos.x * GRID_W))) + 'px';
          char.style.top = (Math.max(0, Math.min(900 - 40, pos.y * GRID_H))) + 'px';
          char.textContent = pos.userId === userId ? '나' : '';
          zoneDiv.appendChild(char);
        });
      });
    });

    // 키 입력 처리
    document.addEventListener('keydown', function(e) {
      if (!stompClient || !userId) return;

      // 이동
      if (['w','a','s','d'].includes(e.key)) {
        stompClient.send("/app/move", {}, JSON.stringify({userId: userId, direction: e.key}));
      }

      // 포탈(E) 키 처리: 내 위치가 포탈 위치와 일치할 때만 동작
      if (e.key === 'e') {
        const portals = portalPositions[myZone] || [];
        const match = portals.find(p => p.x === myPos.x && p.y === myPos.y);
        if (match) {
          stompClient.send("/app/portal", {}, JSON.stringify({userId: userId, portalDirection: match.direction}));
        }
      }
    });
  };
</script>
</body>
</html>
