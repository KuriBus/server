<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WebSocket 캐릭터 이동 및 채팅 테스트</title>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    body { background: #222; font-family: sans-serif; }
    #game {
      width: 1600px;
      height: 900px;
      background: #eee;
      position: relative;
      margin: 0 auto;
      overflow: hidden;
      box-shadow: 0 0 16px #999;
    }
    .zone {
      position: absolute;
      top: 0; left: 0;
      width: 1600px; height: 900px;
      background: #e0f7fa;
    }
    .zone.room { background: #e0f7fa; }
    .zone.bridge { background: #fffde7; }
    .zone-label {
      position: absolute; top: 20px; left: 40px;
      font-weight: bold; font-size: 40px; color: #333;
      text-shadow: 1px 1px 8px #fff;
      z-index: 10;
    }
    .character {
      width: 40px; height: 40px;
      background: #e53935;
      position: absolute;
      border-radius: 10px;
      text-align: center;
      line-height: 40px;
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      border: 2px solid #b71c1c;
      z-index: 5;
      box-shadow: 0 0 8px #0005;
    }
    .portal {
      width: 40px; height: 40px;
      background: #4fc3f7;
      border-radius: 50%;
      position: absolute;
      border: 4px solid #0288d1;
      box-shadow: 0 0 16px #0288d1aa;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #01579b;
      font-weight: bold;
    }
    #chatbox {
      position: absolute;
      left: 20px;
      bottom: 20px;
      width: 400px;
      height: 200px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 10px;
      box-shadow: 0 0 8px #999;
      padding: 10px;
      display: flex;
      flex-direction: column;
      z-index: 20;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
      font-size: 14px;
      max-height: 150px;
    }
    #chatInput {
      width: 100%;
      height: 30px;
      font-size: 14px;
      padding: 5px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
<div id="userForm">
  <label for="nicknameInput">닉네임: </label>
  <input type="text" id="nicknameInput" placeholder="사용자 이름">
  <label for="roomSelect">입장할 방: </label>
  <select id="roomSelect">
    <option value="1">Room 1</option>
    <option value="2">Room 2</option>
    <option value="3">Room 3</option>
  </select>
  <button id="startBtn">시작</button>
</div>
<div id="game">
  <div id="chatbox" style="display:none;">
    <div id="messages"></div>
    <input type="text" id="chatInput" placeholder="메시지를 입력하세요..." />
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
  let nickname = null;
  let stompClient = null;
  const game = document.getElementById('game');
  const chatbox = document.getElementById('chatbox');
  const messages = document.getElementById('messages');
  const chatInput = document.getElementById('chatInput');

  const GRID_W = 40, GRID_H = 40, MAX_X = 39, MAX_Y = 21;
  const CENTER_X = Math.floor(MAX_X / 2);
  const CENTER_Y = Math.floor(MAX_Y / 2);
  const allZones = ["Room 1","Bridge 1","Room 2","Bridge 2","Room 3","Bridge 3"];
  const portalPositions = {};
  allZones.forEach(zone => {
    portalPositions[zone] = [
      { x: 2, y: CENTER_Y, direction: "left" },
      { x: MAX_X-2, y: CENTER_Y, direction: "right" }
    ];
  });
  const zoneIdMap = {
    "Room 1": 1,
    "Room 2": 2,
    "Room 3": 3,
    "Bridge 1": 4,
    "Bridge 2": 5,
    "Bridge 3": 6
  };

  document.getElementById('startBtn').onclick = async function() {
    nickname = document.getElementById('nicknameInput').value.trim();
    const selectedRoomId = document.getElementById('roomSelect').value;

    if (!nickname) return alert('닉네임을 입력하세요!');
    if (!selectedRoomId) return alert('입장할 방을 선택하세요');
    try {
      const res = await fetch(`http://localhost:8080/api/rooms/${selectedRoomId}/join`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          nickname: nickname // 서버에서 닉네임 기반으로 userId 처리하고 있다면 그대로
        })
      });
      if (!res.ok) {
        alert('방 입장에 실패했습니다.');
        return;
      }
    } catch (err) {
      console.error(err);
      alert('방 입장 중 오류 발생');
      return;
    }

    // Step 2: UI 전환
    document.getElementById('userForm').style.display = 'none';
    chatbox.style.display = 'flex';

    const socket = new SockJS('http://localhost:8080/ws/app');
    stompClient = Stomp.over(socket);

    let myZone = "Room 1"; // 기본 위치
    let myPos = { x: CENTER_X, y: CENTER_Y };

    stompClient.connect({}, function () {
      // 초기 위치 전송
      stompClient.send("/app/move", {}, JSON.stringify({
        nickname: nickname,
        direction: "init"
      }));

      // 위치 업데이트 수신
      stompClient.subscribe('/topic/positions', function (message) {
        const allPositions = JSON.parse(message.body);
        const me = allPositions.find(pos => pos.nickname === nickname);
        if (me && me.roomName !== undefined) {
          myZone = me.roomName; // 현재 위치한 방 갱신
          myPos = { x: me.x, y: me.y };
        }

        const oldZoneDiv = game.querySelector('.zone');
        if (oldZoneDiv) {
          game.removeChild(oldZoneDiv);
        }

        // zoneDiv 및 배경, 포탈 그리기
        let zoneDiv = document.createElement('div');
        zoneDiv.className = 'zone ' + (myZone.startsWith('Room') ? 'room' : 'bridge');
        zoneDiv.innerHTML = `<span class="zone-label">${myZone}</span>`;
        game.appendChild(zoneDiv);

        if (portalPositions[myZone]) {
          portalPositions[myZone].forEach(portal => {
            let portalDiv = document.createElement('div');
            portalDiv.className = 'portal';
            portalDiv.style.left = (portal.x * GRID_W) + 'px';
            portalDiv.style.top = (portal.y * GRID_H) + 'px';
            portalDiv.title = portal.direction + " portal";
            portalDiv.innerHTML = portal.direction === "left" ? "←" : "→";
            zoneDiv.appendChild(portalDiv);
          });
        }

        allPositions.filter(pos => pos.roomName === myZone).forEach(pos => {
          let char = document.createElement('div');
          char.className = 'character';
          char.style.left = (Math.max(0, Math.min(1600 - 40, pos.x * GRID_W))) + 'px';
          char.style.top = (Math.max(0, Math.min(900 - 40, pos.y * GRID_H))) + 'px';
          char.textContent = pos.nickname === nickname ? nickname : '';
          zoneDiv.appendChild(char);
        });
      });
      localStorage.setItem("nickname", nickname);
      localStorage.setItem("roomId", selectedRoomId); // 방 번호 문자열로 저장

      window.addEventListener("beforeunload", () => {
        const nickname = localStorage.getItem("nickname");
        const roomId = localStorage.getItem("roomId");

        if (nickname && roomId) {
          navigator.sendBeacon(
              "http://localhost:8080/api/movement/leave",
              new Blob([JSON.stringify({ nickname, roomId })], {
                type: "application/json",
              })
          );
        }
      });
      // 채팅 수신 (닉네임 기반 roomIdMap 사용)
      stompClient.subscribe(`/topic/room/${zoneIdMap[myZone]}`, function (msg) {
        const text = msg.body;
        const div = document.createElement('div');
        div.textContent = `${nickname}: ${text}`;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      });
    });

    document.addEventListener('keydown', function(e) {
      if (!stompClient || !nickname) return;
      if (e.key === 'Enter' && document.activeElement === chatInput) {
        const msg = chatInput.value.trim();
        if (msg !== '') {
          stompClient.send("/app/chat.send", {}, JSON.stringify({
            nickname: nickname,
            content: msg,
            roomId: zoneIdMap[myZone]
          }));
          chatInput.value = '';
        }
      } else if (['w','a','s','d'].includes(e.key)) {
        stompClient.send("/app/move", {}, JSON.stringify({
          nickname: nickname,
          direction: e.key
        }));
      } else if (e.key === 'e') {
        const portals = portalPositions[myZone] || [];
        const match = portals.find(p => p.x === myPos.x && p.y === myPos.y);
        if (match) {
          stompClient.send("/app/portal", {}, JSON.stringify({
            nickname: nickname,
            portalDirection: match.direction
          }));
        }
      }
    });
  };
</script>
</body>
</html>
