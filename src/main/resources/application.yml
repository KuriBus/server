spring:
  jackson:
    time-zone: Asia/Seoul
  datasource: # AWS RDS
    url: ${RDS_URL}
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul         # DB 시간대 강제 지정
    hibernate:
      ddl-auto: create
    generate-ddl: false
  data:
    redis:
      host: localhost #Local: localhost, Docker: redis
      port: 6379 # Docker에서 Redis 컨테이너가 6379 포트를 사용하므로, 호스트에서도 동일한 포트를 사용
      password:
  sql:
    init:
      mode: never
api:
  clova:
    base-url: ${CLOVA_URL}
    task-id: ${CLOVA_TASK_ID}
    key: ${CLOVA_KEY}
  perplexity:
    url: https://api.perplexity.ai
    key: ${PERPLEXITY_KEY}