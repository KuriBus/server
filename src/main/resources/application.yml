spring:
  jackson:
    time-zone: Asia/Seoul
  datasource: # AWS RDS
    url: jdbc:mysql://localhost:3307/capstone
    username: root
    password: goguses123*
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  data:
    redis:
      host: localhost #Local: localhost, Docker: redis
      port: 6379 # Docker에서 Redis 컨테이너가 6379 포트를 사용하므로, 호스트에서도 동일한 포트를 사용

  sql:
    init:
      mode: never
api:
  clova:
    base-url: ${CLOVA_URL}
    task-id: ${CLOVA_TASK_ID}
    key: ${CLOVA_KEY}
    ai_key: ${CLOVA_PLAYGROUND_KEY}
  perplexity:
    url: https://api.perplexity.ai
    key: ${PERPLEXITY_KEY}