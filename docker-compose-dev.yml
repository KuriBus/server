services:
  redis:
    image: redis:latest
    container_name: ${REDIS_CONTAINER_NAME}
    restart: always
    ports:
      - "6379:6379"  # Redis의 기본 포트
    command: redis-server --requirepass ${REDIS_PASSWORD} # Redis 비밀번호 설정
    networks:
      - redis-net
    volumes:
      - redis_data:/data
  app:
    build: .
    image: ${DOCKER_USERNAME}/server:latest  # .env 파일의 변수 사용
    ports:
      - "8080:8080"
    environment:
      RDS_URL: ${RDS_URL}
      RDS_USERNAME: ${RDS_USERNAME}
      RDS_PASSWORD: ${RDS_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CONTAINER_NAME: ${REDIS_CONTAINER_NAME}
      CLOVA_URL: ${CLOVA_URL}
      CLOVA_TASK_ID: ${CLOVA_TASK_ID}
      CLOVA_KEY: ${CLOVA_KEY}
      CLOVA_PLAYGROUND_KEY: ${CLOVA_PLAYGROUND_KEY}
      PERPLEXITY_KEY: ${PERPLEXITY_KEY}
      SPRING_PROFILES_ACTIVE: dev # 개발 환경 프로필 활성화

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - redis-net
    volumes:
      - ./logs:/app/logs

volumes:
  redis_data:

networks:
  redis-net:
    driver: bridge
